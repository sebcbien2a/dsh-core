version: '3.8'

services:
  # PHASE 9 : NEO4J (Base de données orientée Graphe pour le lettrage)
  neo4j:
    image: neo4j:latest
    container_name: dsh-neo4j
    ports:
      - "7474:7474" # Interface Web (Navigateur)
      - "7687:7687" # Port de communication API
    environment:
      - NEO4J_AUTH=neo4j/dshcore2026 # Identifiant et mot de passe
    volumes:
      - A:\dsh-core\neo4j_data:/data
    restart: unless-stopped

  # PHASE 6 : LANGFUSE (Observabilité et comptage des tokens)
  langfuse-db:
    image: postgres:15
    container_name: dsh-langfuse-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langfuse
    volumes:
      - A:\dsh-core\langfuse_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: dsh-langfuse-web
    depends_on:
      - langfuse-db
    ports:
      - "3001:3000" # Interface Web Langfuse
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=dsh_super_secret_key_2026
      - NEXTAUTH_URL=http://localhost:3001
      - SALT=dsh_super_salt_2026
    restart: unless-stopped

  # --- NOUVEAUX SERVICES (Boîte à outils et RAG) ---

  # N8N (Automatisation et Webhooks)
  n8n:
    image: n8nio/n8n
    container_name: dsh-n8n
    ports:
      - "5678:5678"
    volumes:
      - A:\dsh-core\n8n_data:/home/node/.n8n
    restart: unless-stopped

  # QDRANT (Base Vectorielle RAG et Mémoire)
  qdrant:
    image: qdrant/qdrant
    container_name: dsh-qdrant
    ports:
      - "6333:6333"
    volumes:
      - A:\dsh-core\qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # OPEN WEBUI (Interface alternative)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: dsh-open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - A:\dsh-core\open-webui_data:/app/backend/data
    restart: unless-stopped