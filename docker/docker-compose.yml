version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dsh-qdrant
    restart: always
    ports:
      - "6333:6333"   # API REST + Web Dashboard
      - "6334:6334"   # API gRPC (performances élevées)
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true